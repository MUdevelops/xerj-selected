<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="The Timeline">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><clipPath id="c"><rect x="0" y="0" width="0" height="64"><animate attributeName="width" from="0" to="900" dur="1.2s" fill="freeze"/></rect></clipPath></defs>
<rect width="900" height="64" rx="12" fill="#0d1117"/><rect x=".5" y=".5" width="899" height="63" rx="12" fill="none" stroke="#30363d"/>
<g transform="translate(38 32)"><g><line x1="-14" x2="14" y1="0" y2="0" stroke="#30363d" stroke-width="3"/><circle cx="-11" cy="0" r="4" fill="#a3e635"><animate attributeName="opacity" values=".15;1;.15" dur="2.1s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="0" cy="0" r="4" fill="#a3e635"><animate attributeName="opacity" values=".15;1;.15" dur="2.1s" begin="0.5s" repeatCount="indefinite"/></circle><circle cx="11" cy="0" r="4" fill="#a3e635"><animate attributeName="opacity" values=".15;1;.15" dur="2.1s" begin="1.0s" repeatCount="indefinite"/></circle></g></g>
<g clip-path="url(#c)"><text x="76" y="41" font-size="26" font-weight="700" fill="url(#g)" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif">The Timeline</text></g>
<rect x="0" y="59" width="140" height="3" rx="1.5" fill="url(#g)"><animate attributeName="x" values="-140;900" dur="3.2s" repeatCount="indefinite"/></rect></svg>